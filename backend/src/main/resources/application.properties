spring.application.name=csnerd.demo

# Project configuration
app.server.scheme=http
app.server.host=localhost
app.server.port=8080
keycloak.url=http://localhost:8081

# Logging
logging.level.org.springframework.context=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.root=ERROR

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/nerdy
spring.datasource.username=root
spring.datasource.password=1501

# JPA Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.query.fail_on_pagination_over_collection_fetch=true

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.out-of-order=false
spring.flyway.validate-on-migrate=true

# Security
rsa.public-key=classpath:certs/public-key.pem
rsa.private-key=classpath:certs/private-key.pem
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.security.web.FilterChainProxy=DEBUG
app.auth.access-token-expire-seconds=60
app.auth.refresh-token-expire-days=7
app.auth.redirect-uri-admin={baseUrl}/admin
app.auth.redirect-uri-public=http://localhost:3000/
app.auth.access-token-name=ACCESS_TOKEN
app.auth.refresh-token-name=REFRESH_TOKEN

#OAuth
spring.security.oauth2.client.registration.keycloak.client-id=client-test
spring.security.oauth2.client.registration.keycloak.client-secret=LyGbhU8Si18lieKpbyr9VlE3gN8lrUXt
spring.security.oauth2.client.registration.keycloak.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.keycloak.scope=openid, profile, email
spring.security.oauth2.client.registration.keycloak.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.provider.keycloak.issuer-uri=${keycloak.url}/realms/nerdy

# Google OAuth2
google.client-ids=248881263523-2c6unsep5sco8v8sk82lk58ba5s1pu5o.apps.googleusercontent.com

# Caching
logging.level.org.springframework.cache=TRACE
## Post
app.cache.post.public-brief.ttl=5m
app.cache.post.public-brief.maximum-size=10000
app.cache.post.admin-brief.ttl=30m
app.cache.post.admin-brief.maximum-size=4000
app.cache.post.public-detail.ttl=30m
app.cache.post.public-detail.maximum-size=1000
app.cache.post.admin-detail.ttl=1d
app.cache.post.admin-detail.maximum-size=200
## Category
app.cache.category.admin-list.ttl=1d
app.cache.category.admin-list.maximum-size=200
app.cache.category.public-list.ttl=1h
app.cache.category.public-list.maximum-size=400
## Topic
app.cache.topic.admin-list.ttl=1d
app.cache.topic.admin-list.maximum-size=200
app.cache.topic.public-list.ttl=1h
app.cache.topic.public-list.maximum-size=400

# Scheduling
## Cleanup refresh token at 3am
app.schedule.refresh-token-cleanup=0 0 3 * * *
app.schedule.images-disk-cleanup=0 30 3 * * *

# Media
## Where files land on disk (outside the JAR)
app.upload.dir=./uploads

## Multipart limits
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# Rules
app.rule.allowed-media-schemes=http,https
app.rule.allowed-url-schemes=http,https,ftp,mailto
app.rule.allowed-image-extensions=.jpg,.png,.jpeg,.webp
app.rule.allowed-media-hosts=localhost