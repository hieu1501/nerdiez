spring.application.name=nerdiez

# Project configuration
keycloak.url=${KEYCLOAK_URL}
keycloak.public-url=${KEYCLOAK_PUBLIC_URL}
# Behind nginx: build redirect URLs (e.g. OAuth {baseUrl}) from X-Forwarded-* headers.
server.forward-headers-strategy=framework

# Database Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# JPA Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.query.fail_on_pagination_over_collection_fetch=true

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.out-of-order=false
spring.flyway.validate-on-migrate=true

# Security
rsa.public-key=${RSA_PUBLIC_KEY:classpath:certs/public-key.pem}
rsa.private-key=${RSA_PRIVATE_KEY:classpath:certs/private-key.pem}
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.security.web.FilterChainProxy=DEBUG
app.auth.access-token-expire-seconds=60
app.auth.refresh-token-expire-days=7
app.auth.redirect-uri-admin=${APP_AUTH_REDIRECT_URI_ADMIN}
app.auth.redirect-uri-public=${APP_AUTH_REDIRECT_URI_PUBLIC}
app.auth.access-token-name=ACCESS_TOKEN
app.auth.refresh-token-name=REFRESH_TOKEN
# Comma-separated; granted ADMIN on first login instead of the default USER role.
app.auth.admin-emails=${APP_AUTH_ADMIN_EMAILS:}

#OAuth
spring.security.oauth2.client.registration.keycloak.client-id=${KEYCLOAK_CLIENT_ID}
spring.security.oauth2.client.registration.keycloak.client-secret=${KEYCLOAK_CLIENT_SECRET}
spring.security.oauth2.client.registration.keycloak.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.keycloak.scope=openid, profile, email
spring.security.oauth2.client.registration.keycloak.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
# Browser goes to the public host; server-to-server calls go to the Docker-internal host.
# Keycloak's issuer is pinned to the public host, so a single issuer-uri (which also drives
# discovery-time issuer validation) can't satisfy both -- endpoints are split explicitly instead.
spring.security.oauth2.client.provider.keycloak.authorization-uri=${keycloak.public-url}/realms/nerdiez/protocol/openid-connect/auth
spring.security.oauth2.client.provider.keycloak.token-uri=${keycloak.url}/realms/nerdiez/protocol/openid-connect/token
spring.security.oauth2.client.provider.keycloak.user-info-uri=${keycloak.url}/realms/nerdiez/protocol/openid-connect/userinfo
spring.security.oauth2.client.provider.keycloak.jwk-set-uri=${keycloak.url}/realms/nerdiez/protocol/openid-connect/certs
# Manual endpoints above skip issuer discovery, so this doesn't default to "sub" -- must be set explicitly.
spring.security.oauth2.client.provider.keycloak.user-name-attribute=preferred_username

# Caching
## Post
app.cache.post.public-brief.ttl=${APP_CACHE_POST_PUBLIC_BRIEF_TTL:5m}
app.cache.post.public-brief.maximum-size=${APP_CACHE_POST_PUBLIC_BRIEF_MAX_SIZE:10000}
app.cache.post.admin-brief.ttl=${APP_CACHE_POST_ADMIN_BRIEF_TTL:30m}
app.cache.post.admin-brief.maximum-size=${APP_CACHE_POST_ADMIN_BRIEF_MAX_SIZE:4000}
app.cache.post.public-detail.ttl=${APP_CACHE_POST_PUBLIC_DETAIL_TTL:30m}
app.cache.post.public-detail.maximum-size=${APP_CACHE_POST_PUBLIC_DETAIL_MAX_SIZE:1000}
app.cache.post.admin-detail.ttl=${APP_CACHE_POST_ADMIN_DETAIL_TTL:1d}
app.cache.post.admin-detail.maximum-size=${APP_CACHE_POST_ADMIN_DETAIL_MAX_SIZE:200}
## Talk
app.cache.talk.public-brief.ttl=${APP_CACHE_TALK_PUBLIC_BRIEF_TTL:5m}
app.cache.talk.public-brief.maximum-size=${APP_CACHE_TALK_PUBLIC_BRIEF_MAX_SIZE:10000}
app.cache.talk.admin-brief.ttl=${APP_CACHE_TALK_ADMIN_BRIEF_TTL:30m}
app.cache.talk.admin-brief.maximum-size=${APP_CACHE_TALK_ADMIN_BRIEF_MAX_SIZE:4000}
app.cache.talk.public-detail.ttl=${APP_CACHE_TALK_PUBLIC_DETAIL_TTL:30m}
app.cache.talk.public-detail.maximum-size=${APP_CACHE_TALK_PUBLIC_DETAIL_MAX_SIZE:1000}
app.cache.talk.admin-detail.ttl=${APP_CACHE_TALK_ADMIN_DETAIL_TTL:1d}
app.cache.talk.admin-detail.maximum-size=${APP_CACHE_TALK_ADMIN_DETAIL_MAX_SIZE:200}
app.cache.talk.vote.ttl=${APP_CACHE_TALK_VOTE_TTL:3m}
app.cache.talk.vote.maximum-size=${APP_CACHE_TALK_VOTE_MAX_SIZE:15000}
## Category
app.cache.category.admin-list.ttl=${APP_CACHE_CATEGORY_ADMIN_LIST_TTL:1d}
app.cache.category.admin-list.maximum-size=${APP_CACHE_CATEGORY_ADMIN_LIST_MAX_SIZE:200}
app.cache.category.public-list.ttl=${APP_CACHE_CATEGORY_PUBLIC_LIST_TTL:1h}
app.cache.category.public-list.maximum-size=${APP_CACHE_CATEGORY_PUBLIC_LIST_MAX_SIZE:400}
## Tag
app.cache.tag.admin-list.ttl=${APP_CACHE_TAG_ADMIN_LIST_TTL:1d}
app.cache.tag.admin-list.maximum-size=${APP_CACHE_TAG_ADMIN_LIST_MAX_SIZE:200}
app.cache.tag.public-list.ttl=${APP_CACHE_TAG_PUBLIC_LIST_TTL:1h}
app.cache.tag.public-list.maximum-size=${APP_CACHE_TAG_PUBLIC_LIST_MAX_SIZE:400}
## Topic
app.cache.topic.admin-list.ttl=${APP_CACHE_TOPIC_ADMIN_LIST_TTL:1d}
app.cache.topic.admin-list.maximum-size=${APP_CACHE_TOPIC_ADMIN_LIST_MAX_SIZE:200}
app.cache.topic.public-list.ttl=${APP_CACHE_TOPIC_PUBLIC_LIST_TTL:1h}
app.cache.topic.public-list.maximum-size=${APP_CACHE_TOPIC_PUBLIC_LIST_MAX_SIZE:400}
## Vote
app.cache.post.vote.ttl=${APP_CACHE_POST_VOTE_TTL:3m}
app.cache.post.vote.maximum-size=${APP_CACHE_POST_VOTE_MAX_SIZE:15000}

# Scheduling
## Cleanup refresh token at 3am
app.schedule.refresh-token-cleanup=0 0 3 * * *
app.schedule.images-disk-cleanup=0 30 3 * * *

# Media
## Multipart limits
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=${MULTIPART_MAX_FILE_SIZE:1MB}
spring.servlet.multipart.max-request-size=${MULTIPART_MAX_REQUEST_SIZE:2MB}
## Uploads per user per hour from the public website (admin uploads are not capped)
app.upload.public.max-per-hour=${APP_UPLOAD_PUBLIC_MAX_PER_HOUR:10}

## R2 (Cloudflare) object storage
cloudflare.r2.access-key-id=${R2_ACCESS_KEY_ID}
cloudflare.r2.secret-access-key=${R2_SECRET_ACCESS_KEY}
cloudflare.r2.bucket-name=${R2_BUCKET_NAME}
cloudflare.r2.endpoint=${R2_ENDPOINT}
cloudflare.r2.public-url=${R2_PUBLIC_URL}

# Rules
app.rule.allowed-media-schemes=http,https
app.rule.allowed-url-schemes=http,https,ftp,mailto
app.rule.allowed-image-extensions=.jpg,.png,.jpeg,.webp
