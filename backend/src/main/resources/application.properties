spring.application.name=csnerd.demo

# Project configuration
app.url=http://localhost:8080
keycloak.url=http://localhost:8081

# Logging
logging.level.org.springframework.context=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.root=ERROR

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/nerdy
spring.datasource.username=root
spring.datasource.password=1501

# JPA Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.out-of-order=false
spring.flyway.validate-on-migrate=true

# Security
rsa.public-key=classpath:certs/public-key.pem
rsa.private-key=classpath:certs/private-key.pem
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.security.web.FilterChainProxy=DEBUG
app.auth.access-token-expire-seconds=60
app.auth.refresh-token-expire-days=7
app.auth.redirect-uri-admin={baseUrl}/admin
app.auth.redirect-uri-public=http://localhost:3000/
app.auth.access-token-name=ACCESS_TOKEN
app.auth.refresh-token-name=REFRESH_TOKEN

#OAuth
spring.security.oauth2.client.registration.keycloak.client-id=client-test
spring.security.oauth2.client.registration.keycloak.client-secret=LyGbhU8Si18lieKpbyr9VlE3gN8lrUXt
spring.security.oauth2.client.registration.keycloak.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.keycloak.scope=openid, profile, email
spring.security.oauth2.client.registration.keycloak.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.provider.keycloak.issuer-uri=${keycloak.url}/realms/nerdy

