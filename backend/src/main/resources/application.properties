spring.application.name=csnerd.demo

# Logging
logging.level.org.springframework.context=DEBUG
logging.level.org.hibernate.SQL=DEBUG

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/nerdy
spring.datasource.username=root
spring.datasource.password=1501

# JPA Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.out-of-order=false
spring.flyway.validate-on-migrate=true

# Security
rsa.public-key=classpath:certs/public-key.pem
rsa.private-key=classpath:certs/private-key.pem
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.security.web.FilterChainProxy=DEBUG

# Admin bootstrap (disabled by default)
app.bootstrap.admin.enabled=true
app.bootstrap.admin.username=admin
app.bootstrap.admin.password=admin
app.bootstrap.admin.role-code=ADMIN
