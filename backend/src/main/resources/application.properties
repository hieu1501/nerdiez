spring.application.name=csnerd.demo

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/nerdy
spring.datasource.username=root
spring.datasource.password=1501

# JPA Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.out-of-order=false
spring.flyway.validate-on-migrate=true

# Security
rsa.public.key.path=classpath:certs/public.pem
rsa.private.key.path=classpath:certs/private.pem

