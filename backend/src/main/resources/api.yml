openapi: 3.1.0
info:
  title: 'Nerdy Blog API'
  description: 'API for a blog website with mainly computer science and economics topics.'
  version: 0.0.1
servers:
  - url: https://{userName}.{domainName}:{port}/blog/{version}
    variables:
      userName:
        default: nerdy
      port:
        enum:
          - "443"
          - "8443"
        default: "443"
      version:
        default: v1
      domainName:
        default: dev
tags:
  - name: articles
    description: Articles for public users
  - name: admin articles
    description: Article management operations
  - name: users
    description: User management operations
paths:
  /articles:
    get:
      tags: [articles]
      summary: Get all articles for reading
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  recentArticles:
                    $ref: '#/components/schemas/articleList'
                  mostViewedArticles:
                    $ref: '#/components/schemas/articleList'
                  featuredArticles:
                    $ref: '#/components/schemas/articleList'
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
  /articles/c/{category}:
    get:
      tags: [articles]
      summary: Get articles filtered by category
      parameters:
        - name: category
          in: path
          required: true
          schema:
            type: string
        - name: topics
          in: query
          required: false
          description: |
            Tags to filter articles.
            Separated by '+' for multiple tags.
          example: 'data-structure+math'
          schema:
            type: string
      responses:
        "200":
          description: "OK"
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
  /articles/{id}:
    get:
      tags: [articles]
      summary: Read an article
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/articleDetail'
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
  /admin/articles:
    get:
      tags: [admin articles]
      summary: Get all articles for management
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/articleList'
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
    post:
      tags: [admin articles]
      summary: Add an article
      security:
        - bearerHttpAuthentication:
            - write: authorizedUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/articleAdd'
      responses:
        "200":
          description: OK
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
  /admin/articles/{id}:
    get:
      tags: [admin articles]
      summary: Inspect an article
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/articleDetail'
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
    delete:
      tags: [admin articles]
      summary: Delete an article
      security:
        - bearerHttpAuthentication:
            - write: authorizedUser
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: "OK"
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
    patch:
      tags: [admin articles]
      summary: Update an article
      security:
        - bearerHttpAuthentication:
            - write: authorizedUser
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/articleUpdate'
      responses:
        "200":
          description: "OK"
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
  /users/{id}:
    get:
      tags: [users]
      summary: Information of an user
      security:
        - bearerHttpAuthentication:
            - write: authorizedUser
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/userProfile'
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
    delete:
      tags: [users]
      summary: Delete an user
      security:
        - bearerHttpAuthentication:
            - write: admin
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: "OK"
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
    patch:
      tags: [users]
      summary: Change information of an user
      security:
        - bearerHttpAuthentication:
            - write: authorizedUser
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/userProfileUpdate'
      responses:
        "200":
          description: "OK"
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
                /users/{id}:
  /categories:
    post:
      tags: [categories]
      summary: Add a category
      security:
        - bearerHttpAuthentication:
            - write: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: string
      responses:
        "200":
          description: OK
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
  /categories/{id}:
    delete:
      tags: [categories]
      summary: Delete a category
      security:
        - bearerHttpAuthentication:
            - write: admin
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: "OK"
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
    patch:
      tags: [categories]
      summary: Change information of a category
      security:
        - bearerHttpAuthentication:
            - write: admin
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: string
      responses:
        "200":
          description: "OK"
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
  /topics:
    post:
      tags: [topics]
      summary: Add a topic
      security:
        - bearerHttpAuthentication:
            - write: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: string
      responses:
        "200":
          description: OK
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
  /topics/{id}:
    delete:
      tags: [topics]
      summary: Delete a topic
      security:
        - bearerHttpAuthentication:
            - write: admin
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: "OK"
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
    patch:
      tags: [topics]
      summary: Change information of a topic
      security:
        - bearerHttpAuthentication:
            - write: authorizedUser
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: string
      responses:
        "200":
          description: "OK"
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
components:
  schemas:
    category:
      description: Category of a blog
      type: string
      enum: ['cs', 'econs']
    topic:
      description: Topic of a blog
      type: string
    articleShow:
      description: Article showcase
      type: object
      properties:
        name:
          type: string
        author:
          type: string
        uploadAt:
          type: string
          format: date
        upvotes:
          type: integer
        downvote:
          type: integer
        category:
          $ref: '#/components/schemas/category'
        topics:
          type: array
          minItems: 1
          maxItems: 5
          items:
            $ref: '#/components/schemas/topic'
    articleDetail:
      description: Content of article
      type: object
      properties:
        name:
          type: string
        content:
          type: string
        author:
          type: string
        uploadAt:
          type: string
          format: date
        upvotes:
          type: integer
        downvote:
          type: integer
        category:
          $ref: '#/components/schemas/category'
        topics:
          type: array
          minItems: 1
          maxItems: 5
          items:
            $ref: '#/components/schemas/topic'
    articleAdd:
      description: Article content to add
      type: object
      properties:
        name:
          type: string
        content:
          type: string
        author:
          type: string
        featuredImage:
          type: string
        category:
          $ref: '#/components/schemas/category'
        topics:
          type: array
          minItems: 1
          maxItems: 5
          items:
            $ref: '#/components/schemas/topic'
    articleUpdate:
      description: Components to update an article
      type: object
      properties:
        name:
          type: string
        content:
          type: string
        category:
          $ref: '#/components/schemas/category'
        featuredImage:
          type: string
        topics:
          type: array
          minItems: 1
          maxItems: 5
          items:
            $ref: '#/components/schemas/topic'
    articleList:
      type: array
      items:
        $ref: '#/components/schemas/articleShow'
    userProfile:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        ownedArticles:
          $ref: '#/components/schemas/articleList'
    userProfileUpdate:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
    error:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: integer
          format: int32
        message:
          type: string
  securitySchemes:
    bearerHttpAuthentication:
      description: Bearer token using JWT
      type: http
      scheme: Bearer
      bearerFormat: JWT