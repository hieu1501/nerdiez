# Backend routes shared by both frontends' hosts, so browser calls stay same-origin.
location /api/ {
    proxy_pass http://nerdiez_spring;
}

location = /api/media/upload {
    # Same headroom as /admin/api/: a 1MB image plus form overhead exceeds the 1m default.
    client_max_body_size 2m;
    proxy_pass http://nerdiez_spring;
}

location /admin/api/ {
    # nginx's 1m default would reject a 1MB image plus form overhead; Spring enforces the real limit.
    client_max_body_size 2m;
    proxy_pass http://nerdiez_spring;
}

location /oauth2/ {
    proxy_pass http://nerdiez_spring;
}

location /login/oauth2/ {
    proxy_pass http://nerdiez_spring;
}
